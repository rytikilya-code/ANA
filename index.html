<meta charset="utf-8">
<title>ANA — Anastasia Kosheleva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Anastasia Kosheleva — pianist, composer and director. Music, film and education.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
/* Brief: cinematic, raw, artistic; mostly dark with light screens where the material asks for it; works speak first;
   85% visual; expressive editorial serif for titles + clean sans for text; calm, expensive motion.
   The ΛNΛ mark is redrawn from the client's own header artwork. */
:root{
  color-scheme:dark;
  --bg:#0C0B0A; --bg-2:#161412; --ivory:#ECE6DA; --grey:#8F897F; --olive:#7C7B5C; --line:rgba(236,230,218,.14);
  --paper:#E8E2D6; --ink:#181614; --ink-grey:#6E685F; --ink-line:rgba(24,22,20,.16);
  --serif:"Gloock","Bodoni 72","Didot",Georgia,serif;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --side:clamp(16px,3vw,44px);
  --gl:max(var(--side), env(safe-area-inset-left,0px));
  --gr:max(var(--side), env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ivory);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img,video{display:block;max-width:100%}
:focus-visible{outline:1px solid currentColor;outline-offset:4px}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}
.mute{color:var(--grey)}
.caps{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.serif{font-family:var(--serif);font-weight:400}

/* ---------- header ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gr) 20px var(--gl);color:var(--ivory);transition:color .4s;pointer-events:none}
.top > *{pointer-events:auto}
.top::before{content:"";position:absolute;inset:0 0 -30px;background:linear-gradient(rgba(12,11,10,.55),rgba(12,11,10,0));pointer-events:none;transition:opacity .4s;z-index:-1}
body.tone-light .top{color:var(--ink)}
body.tone-light .top::before{opacity:0}
body.scrolled:not([data-view="home"]) .top{background:var(--bg)}
body.scrolled[data-view="biography"] .top{background:#FFFFFF}
body.scrolled:not([data-view="home"]) .top::before{opacity:0}
.logo{display:block;text-decoration:none;line-height:0}
.logo svg{height:19px;width:auto;overflow:visible}
.logo path{fill:none;stroke:currentColor;stroke-width:1.15;vector-effect:non-scaling-stroke}
.nav{display:flex;gap:clamp(16px,2.4vw,36px)}
.nav a{text-decoration:none;opacity:.62;transition:opacity .3s;padding:4px 0;position:relative}
.nav a:hover{opacity:1}
.nav a[aria-current="page"]{opacity:1}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor}
@media (max-width:760px){
  .top{flex-direction:column;align-items:flex-start;gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
  .nav{gap:0;justify-content:space-between;width:100%}
  .nav a{font-size:11px;letter-spacing:.12em}
}

/* ---------- opening ---------- */
.opening{position:fixed;inset:0;z-index:95;background:#000;display:grid;place-items:center;transition:opacity 1.1s ease,visibility 1.1s}
.opening.out{opacity:0;visibility:hidden}
.opening .mark{display:flex;flex-direction:column;align-items:center;gap:22px;color:var(--ivory)}
.opening svg{width:min(56vw,380px);height:auto;overflow:visible}
.opening path{fill:none;stroke:currentColor;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s var(--ease) forwards}
.opening path:nth-child(2){animation-delay:.18s}.opening path:nth-child(3){animation-delay:.36s}
@keyframes draw{to{stroke-dashoffset:0}}
.opening .motto{font-size:clamp(10px,1.1vw,13px);letter-spacing:.42em;text-transform:uppercase;opacity:0;animation:fadein 1.2s ease .9s forwards;padding-left:.42em;white-space:nowrap}
@keyframes fadein{to{opacity:.78}}

/* ---------- home: selected works ---------- */
.reel{position:relative}
.frame{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;display:block;text-decoration:none;background:var(--bg)}
.frame .bgm{position:absolute;inset:-8% 0;will-change:transform}
.frame .bgm img,.frame .bgm video{width:100%;height:100%;object-fit:cover}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55));pointer-events:none}
.frame .shade{position:absolute;inset:0;background:#000;opacity:.06;transition:opacity .6s}
.frame:hover .shade{opacity:0}
.frame.cover .bgm img.blur{filter:blur(44px) brightness(.42) saturate(.9);transform:scale(1.2)}
.frame.cover .sq{position:absolute;left:50%;top:50%;height:min(76svh,76vw);aspect-ratio:1;transform:translate(-50%,-50%);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.frame.cover .sq img{width:100%;height:100%;object-fit:cover}
.frame .label{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(28px,6vh,64px));z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.title{margin:0;font:400 clamp(40px,6.4vw,112px)/.95 var(--serif);text-transform:uppercase;letter-spacing:-.005em;max-width:13ch}
.title .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .06em;margin-bottom:-.06em}
.title .w > span{display:inline-block;transform:translateY(102%);filter:blur(6px);opacity:0;transition:transform 1.1s var(--ease),filter 1.1s var(--ease),opacity .8s ease}
.in .title .w > span,.title.in .w > span{transform:none;filter:none;opacity:1}
.facts-line{margin-top:16px;font-size:15px;line-height:1.45;opacity:0;transform:translateY(8px);transition:opacity .9s ease .35s,transform .9s var(--ease) .35s}
.facts-line span{display:block}
.facts-line span + span{color:var(--grey)}
.in .facts-line{opacity:1;transform:none}
.frame .count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--grey);white-space:nowrap}
.frame .go{display:inline-block;margin-top:8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .4s}
.frame:hover .go,.frame:focus-visible .go{opacity:.85}
@media (hover:none){.frame .go{display:none}}
.frame.light{background:var(--paper);color:var(--ink)}
.frame.light::after{display:none}
.frame.light .inner{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(28px,5vw,80px);align-items:center;padding:calc(env(safe-area-inset-top,0px) + 110px) var(--gr) 120px var(--gl)}
.frame.light blockquote{margin:0;font:400 clamp(30px,3.7vw,64px)/1.12 var(--serif);letter-spacing:-.01em;max-width:20ch}
.frame.light .ph{height:min(62vh,560px);aspect-ratio:3/4;justify-self:end;overflow:hidden}
.frame.light .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(.2)}
.frame.light .label{color:var(--ink)}
.frame.light .title{font-size:clamp(22px,2vw,30px)}
.frame.light .facts-line span + span,.frame.light .count{color:var(--ink-grey)}
@media (max-width:760px){
  .frame.light .inner{grid-template-columns:1fr;align-content:center;gap:28px;padding-top:150px}
  .frame.light .ph{height:30vh;justify-self:start}
  .frame .label{flex-direction:column;align-items:flex-start;gap:12px}
  .frame.light{height:auto;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:150px var(--gr) 48px var(--gl)}
  .frame.light .inner{position:static;padding:0}
  .frame.light .label{position:static;margin-top:32px}
}
.closing{min-height:90vh;display:flex;flex-direction:column;justify-content:center;padding-block:120px}
.closing .title{font-size:clamp(48px,9vw,160px);max-width:none}
.closing .row{display:flex;gap:clamp(20px,4vw,56px);flex-wrap:wrap;margin-top:40px;font-size:17px}
.closing .row a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px;transition:border-color .3s}
.closing .row a:hover{border-color:var(--ivory)}

/* ---------- inner pages ---------- */
.page{padding-top:calc(env(safe-area-inset-top,0px) + 150px);padding-bottom:120px}
@media (max-width:760px){.page{padding-top:calc(env(safe-area-inset-top,0px) + 128px)}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.page-head .title{font-size:clamp(48px,8.5vw,150px);max-width:none}
.page-head p{margin:0;max-width:34ch;color:var(--grey);font-size:16px}

/* music */
.rail{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;overscroll-behavior-x:contain;margin-top:clamp(40px,6vw,80px)}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing}
.rail.dragging button,.rail.dragging a{pointer-events:none}
.rail-in{display:flex;gap:clamp(14px,1.6vw,24px);width:max-content;padding:0 var(--gr) 0 var(--gl);align-items:flex-start}
.track{--h:clamp(280px,58vh,640px);flex:0 0 auto;width:calc(var(--h) * var(--ar,1))}
.track .media{position:relative;display:block;width:100%;height:var(--h);overflow:hidden;background:var(--bg-2)}
.track .media img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease),filter .6s}
.track:hover .media img{transform:scale(1.025)}
.track .play{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.disc{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.7);display:grid;place-items:center;background:rgba(12,11,10,.25);backdrop-filter:blur(6px);transition:background .3s,border-color .3s,color .3s;color:#fff}
.track:hover .disc,.track.is-playing .disc{background:var(--ivory);border-color:var(--ivory);color:var(--bg)}
.tri{width:0;height:0;border-left:10px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.bars{display:inline-flex;gap:3px}.bars i{display:block;width:2px;height:12px;background:currentColor}
.track .cap{margin-top:16px;display:grid;gap:2px}
.track .rowplay{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);text-align:left}
.track .rowplay .disc{width:40px;height:40px;border-color:var(--line);background:none;color:var(--ivory);backdrop-filter:none}
.track:hover .rowplay .disc,.track.is-playing .rowplay .disc{background:var(--ivory);border-color:var(--ivory);color:var(--bg)}
.track .cap b{font:400 20px/1.15 var(--serif);text-transform:uppercase;letter-spacing:.005em;font-weight:400}
.track .cap span{color:var(--grey);font-size:15px;line-height:1.4}
.track .cap small{margin-top:6px;font-size:13px;color:var(--grey)}
.track .cap small a{color:var(--ivory)}
.spot{justify-self:start;display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ivory);transition:border-color .3s,background .3s,color .3s}
.arr{width:.85em;height:.85em;flex:none;vertical-align:-.05em}
.spot:hover{border-color:var(--ivory);background:var(--ivory);color:var(--bg)}
.rail-bar{display:flex;align-items:center;gap:20px;margin-top:30px}
.rail-bar .prog{flex:1;height:1px;background:var(--line);position:relative}
.rail-bar .prog span{position:absolute;left:0;top:0;height:1px;background:var(--ivory);width:20%}
.rail-bar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);transition:border-color .3s}
.rail-bar button:hover{border-color:var(--ivory)}
.rail-bar button:disabled{opacity:.25;cursor:default}
.drop{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:18px;margin-top:clamp(72px,10vw,140px);padding:18px 0;border-top:0;border-bottom:1px solid var(--line);text-align:left}
.drop .t{font:400 clamp(30px,4vw,60px)/1 var(--serif);text-transform:uppercase}
.drop .x{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);white-space:nowrap}
.rep{padding-top:40px;columns:3 260px;column-gap:clamp(28px,4vw,64px)}
.rep-group{break-inside:avoid;margin:0 0 30px}
.rep-group h4{margin:0 0 8px;font:500 15px/1.3 var(--sans)}
.rep-group p{margin:0 0 4px;font-size:14px;color:var(--grey)}
.rep-group ul{list-style:none;margin:0;padding:0}
.rep-group li{font-size:15px;line-height:1.55;color:#C9C3B7}
.rep-heading{column-span:all;margin:10px 0 30px;padding-top:24px;border-top:1px solid var(--line);font:400 clamp(24px,2.6vw,36px)/1 var(--serif);text-transform:uppercase}

/* video */
.tabs{display:flex;gap:28px;margin-top:36px;flex-wrap:wrap}
.tabs button{padding:6px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;border-bottom:1px solid transparent;transition:opacity .3s}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:currentColor}
.feature{position:relative;display:block;width:100%;height:88vh;height:88svh;min-height:420px;margin-top:clamp(36px,5vw,64px);overflow:hidden;background:#000;text-align:left}
.feature .bgm{position:absolute;inset:-8% 0}
.feature img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
.feature:hover img{transform:scale(1.02)}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.6))}
.feature .label{position:absolute;left:var(--gl);right:var(--gr);bottom:clamp(24px,5vh,56px);z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.feature .play{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.feature .disc{width:72px;height:72px}
.feature .disc .tri{border-left-width:14px;border-top-width:9px;border-bottom-width:9px;margin-left:4px}
.feature:hover .disc{background:var(--ivory);border-color:var(--ivory);color:var(--bg)}
@media (max-width:760px){.feature{height:70svh}.feature .label{flex-direction:column;align-items:flex-start}}
.film-text{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(28px,6vw,110px);margin-top:clamp(56px,8vw,110px);align-items:start}
.film-text .syn{margin:0;font-size:clamp(19px,1.6vw,23px);line-height:1.55;color:#D9D3C7;max-width:44ch}
.film-text .credit{margin:18px 0 0;font-size:15px;color:var(--grey)}
.laurels{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.laurels li{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.laurels .f{font:400 20px/1.2 var(--serif);text-transform:uppercase}
.laurels .k{display:block;margin-top:4px;font-size:14px;color:var(--grey)}
@media (max-width:760px){.film-text{grid-template-columns:1fr}}
/* stills: inset from the edges; every gap — between rows and inside a row — is the same --g.
   Frames in a row share one height: each grows in proportion to its aspect ratio. */
.stills{--g:clamp(8px,1vw,14px);margin:clamp(80px,12vw,180px) auto 0;max-width:1240px;padding:0 clamp(0px,4vw,64px);display:flex;flex-direction:column;gap:var(--g)}
.stills .row{display:flex;gap:var(--g)}
.stills figure{margin:0;overflow:hidden;background:var(--bg-2);position:relative;flex:var(--ar) 1 0;aspect-ratio:var(--ar);min-width:0}
.stills figure > div{position:absolute;inset:-5% 0;will-change:transform}
.stills img{width:100%;height:100%;object-fit:cover}
.stills .big{--ar:1.7778}
.stills .a1,.stills .b2{--ar:1.3333}
.stills .b1,.stills .a2{--ar:.8}
.stills .wide{--ar:2.39}
.film-more{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,64px);margin-top:clamp(80px,12vw,180px);align-items:end}
.film-more figure{margin:0}
.film-more .poster img{width:100%;aspect-ratio:2/3;object-fit:cover}
.film-more .bts{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000}
.film-more .bts img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.film-more .bts:hover img{transform:scale(1.02)}
.film-more .bts .play{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.film-more .bts:hover .disc{background:var(--ivory);border-color:var(--ivory);color:var(--bg)}
.film-more figcaption{margin-top:12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
@media (max-width:760px){.film-more{grid-template-columns:1fr}.film-more .poster{max-width:72%}}
.note{margin:clamp(48px,8vw,110px) 0 0;max-width:28ch;font:400 clamp(26px,3vw,44px)/1.2 var(--serif)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:clamp(28px,3vw,44px) clamp(16px,2vw,28px);margin-top:clamp(40px,6vw,80px)}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none}
.tile .m{position:relative;aspect-ratio:var(--ar,16/9);overflow:hidden;background:var(--bg-2);margin-bottom:10px}
.tile .m img{width:100%;height:100%;object-fit:cover}
.tile h3{margin:0;font:400 22px/1.15 var(--serif);text-transform:uppercase}
.tile p{margin:0;font-size:15px;color:var(--grey)}

body[data-view="biography"]{background:#FFFFFF}
/* biography: a light page, the text reads like a programme note */
body.page-light{background:var(--paper);color:var(--ink)}
.light-page{background:#FFFFFF;color:var(--ink)}
.light-page .mute,.light-page .page-head p{color:var(--ink-grey)}
.bio{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,6vw,110px);align-items:start;margin-top:clamp(48px,6vw,96px)}
.bio figure{margin:0;position:sticky;top:120px}
.bio figure img{width:100%;aspect-ratio:4/5;object-fit:cover}
.bio figcaption{margin-top:12px;font-size:13px;color:var(--ink-grey)}
.bio .lead{margin:0 0 36px;font:400 clamp(24px,2.4vw,38px)/1.2 var(--serif)}
.bio .text p{margin:0 0 18px;max-width:60ch;font-size:17px;line-height:1.72;color:#2E2B27}
.more{margin-top:8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:3px}
.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:0 24px;margin:48px 0 0}
.facts dt,.facts dd{margin:0;padding:9px 0}
.facts dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-grey);padding-top:15px}
.facts dd{font-size:15px}
@media (max-width:860px){.bio{grid-template-columns:1fr}.bio figure{position:static;max-width:460px}.facts{grid-template-columns:1fr}.facts dt{padding-bottom:0}}
.press{margin-top:clamp(100px,13vw,200px)}
.press > .title{font-size:clamp(40px,6vw,96px);max-width:none}
.p-row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,6vw,110px);align-items:center;margin-top:clamp(64px,9vw,140px)}
.p-row .pic{margin:0}
.p-row .pic img{width:auto;max-width:100%;height:auto;max-height:86vh;box-shadow:0 0 0 rgba(0,0,0,0);opacity:0;transform:translateY(36px) scale(.985);transition:opacity 1.1s ease,transform 1.3s var(--ease),box-shadow 1.6s var(--ease) .25s}
.p-row.in .pic img{opacity:1;transform:none;box-shadow:0 18px 50px rgba(0,0,0,.10)}
.p-row.in .pic:hover img{transform:translateY(-6px);box-shadow:0 34px 80px rgba(0,0,0,.16);transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.p-row > div > *{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform 1.1s var(--ease)}
.p-row.in > div > *{opacity:1;transform:none}
.p-row.in > div > :nth-child(1){transition-delay:.35s}.p-row.in > div > :nth-child(2){transition-delay:.45s}.p-row.in > div > :nth-child(3){transition-delay:.6s}

came a laureate of international music competitions in Italy, the UAE, France, and countries across Asia.", "Her career has taken her across many countries and cultures. As a pianist, Anastasia has performed and worked in France, Italy, China, Kyrgyzstan, Thailand, and the United Arab Emirates, developing her artistic thinking through constant interaction with different cultures, traditions, and forms of art.", "Alongside her performing career, she has taught music for more than ten years. Her work has included individual lessons, masterclasses, and academic projects, while her own professional development continues through interaction with musicians, professors, and artists from different fields.", "Anastasia’s musical repertoire spans works from the Baroque and Classical periods to Romanticism and twentieth-century music. She is particularly interested in composers whose music combines strict architectural form with deep psychological content. Alongside the classical repertoire, she develops her own musical projects and searches for contemporary visual forms of presenting music.", "Gradually, her creative interests expanded beyond performance into photography, visual art, composition, and cinema. She does not view these areas as separate disciplines, but rather as different ways of expressing one inner idea. Her work often explores themes of atmosphere, memory, identity, displacement, and the interaction between sound and image.", "In 2026, Anastasia made her debut as a director and producer with the experimental short film The Transition — a dialogue-free work inspired by the inner experience of emigration during wartime. The film is built around her performance of Chopin’s Étude Op. 25 No. 12 and the visual contrast between warmth, isolation, movement, and a sense of liminal space. This project became a continuation of her musical language through cinema and received international festival recognition, including official selections and awards.", "Her visual appr <script>
(function(){
"use strict";
var C=null,$=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var VIEWS=["home","music","video","education","biography","contact"];
var PLAY='<span class="tri" aria-hidden="true"></span>',PAUSE='<span class="bars" aria-hidden="true"><i></i><i></i></span>';
var LOGO='<svg viewBox="0 0 318 70" aria-hidden="true"><use href="#ana"/></svg>';
var VO=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function mmss(t){t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function secs(d){var p=String(d||"").split(":").map(Number);if(p.some(isNaN))return 0;return p.reduce(function(a,b){return a*60+b},0)}
function ratio(r,d){if(!r)return d;var p=String(r).split("/");return (+p[0])/(+p[1])||d}
function n2(i){return String(i+1).padStart(2,"0")}
// split a title into words that rise one after another
function words(t){return esc(t).split(/\s+/).map(function(w,i){return '<span class="w"><span style="transition-delay:'+(i*0.08).toFixed(2)+'s">'+w+'</span></span>'}).join(" ")}
function foot(){return '<footer class="foot wrap"><a class="logo" href="#" aria-label="ANA — home">'+LOGO+'</a><span>'+esc(C.site.motto||"")+'</span><span data-studio>'+esc(C.site.name)+'</span></footer>'}

/* ---------- reveal + scroll movement ---------- */
var io=null,moving=[];
function watch(root){
  var els=$$("[data-reveal]",root);
  if(reduce||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
  if(!io)io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.25});
  els.forEach(function(e){io.observe(e)});
}
function move(){var vh=innerHeight;moving.forEach(function(el){if(el.offsetParent===null)return;var r=el.parentNode.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;var p=(r.top+r.height/2-vh/2)/vh;el.style.transform="translate3d(0,"+(p*-7).toFixed(2)+"%,0)"})}
if(!reduce){var tk=false;window.addEventListener("scroll",function(){if(!tk){tk=true;requestAnimationFrame(function(){tk=false;move();tone()})}},{passive:true});window.addEventListener("resize",move)}
else window.addEventListener("scroll",function(){tone()},{passive:true});
// header switches to dark ink while a light screen is under it
function tone(){var v=document.body.dataset.view,light=v==="biography";if(v==="home"){$$(".frame.light").forEach(function(f){var r=f.getBoundingClientRect();if(r.top<=40&&r.bottom>40)light=true})}document.body.classList.toggle("tone-light",light)}

/* ---------- load ---------- */
function start(d){C=d;build();route();opening()}
function fallback(){var f=document.getElementById("content-fallback");if(f){try{return start(JSON.parse(f.textContent))}catch(e){}}$("#app").innerHTML='<p class="err">The site content could not be loaded. Please refresh the page.</p>'}
function build(){$("#wa").href=C.site.whatsapp;moving=[];buildHome();buildMusic();buildVideo();buildEducation();buildBio();buildContact();watch(document)}

/* ---------- opening: the mark draws itself once per visit ---------- */
function opening(){
  var o=$("#opening"),seen=false;
  try{seen=sessionStorage.getItem("ana-open")==="1"}catch(e){}
  if(reduce||seen||(location.hash&&location.hash!=="#"))return;
  $("#motto").textContent=C.site.motto||"";o.hidden=false;document.documentElement.style.overflow="hidden";
  var done=false;function end(){if(done)return;done=true;o.classList.add("out");document.documentElement.style.overflow="";try{sessionStorage.setItem("ana-open","1")}catch(e){}setTimeout(function(){o.hidden=true},1200)}
  setTimeout(end,2700);o.addEventListener("click",end);window.addEventListener("wheel",end,{once:true,passive:true});window.addEventListener("keydown",end,{once:true});window.addEventListener("touchstart",end,{once:true,passive:true});
}

/* ---------- home: one selected work per screen ---------- */
function label(h,i,total){
  var lines=[h.subtitle].concat(String(h.meta||"").split(" — ")).filter(Boolean);
  return '<div class="label"><div><h2 class="title">'+words(h.title)+'</h2><div class="facts-line">'+lines.map(function(l){return '<span>'+esc(l)+'</span>'}).join("")+'</div></div><div style="text-align:right"><span class="count">'+n2(i)+' / '+String(total).padStart(2,"0")+'</span><br><span class="go">View</span></div></div>';
}
function buildHome(){
  var v=$("#v-home"),T=C.hero.length;
  var frames=C.hero.map(function(h,i){
    var href='#'+esc(h.link||"");
    if(h.media==="quote")return '<a class="frame light" href="'+href+'" data-reveal><div class="inner"><blockquote>“'+esc(h.quote)+'”</blockquote>'+(h.src?'<div class="ph"><img src="'+esc(h.src)+'" alt="" loading="lazy"></div>':'')+'</div>'+label(h,i,T)+'</a>';
    var pos=esc(h.focus||"50% 50%");
    if(h.media==="cover")return '<a class="frame cover" href="'+href+'" data-reveal><div class="bgm"><img class="blur" src="'+esc(h.src)+'" alt="" loading="lazy"></div><div class="sq"><img src="'+esc(h.src)+'" alt="" loading="lazy"></div><div class="shade"></div>'+label(h,i,T)+'</a>';
    var media=h.media==="video"?'<video muted loop playsinline preload="'+(i<1?"auto":"none")+'" poster="'+esc(h.poster||"")+'" src="'+esc(h.src)+'" style="object-position:'+pos+'"></video>':'<img src="'+esc(h.src)+'" alt="" loading="'+(i<1?"eager":"lazy")+'" style="object-position:'+pos+'">';
    return '<a class="frame" href="'+href+'" data-reveal><div class="bgm">'+media+'</div><div class="shade"></div>'+label(h,i,T)+'</a>';
  }).join("");
  var ch=C.contact.channels;
  v.innerHTML='<div class="reel">'+frames+'</div><section class="closing wrap" data-reveal><h2 class="title">'+words(C.site.cta)+'</h2><div class="row">'+ch.slice(0,3).map(function(x){return '<a href="'+esc(x.href)+'"'+(/^https?:/.test(x.href)?' target="_blank" rel="noopener"':'')+'>'+esc(x.value)+'</a>'}).join("")+'</div></section>'+foot();
  moving=moving.concat($$(".frame .bgm",v));
  if("IntersectionObserver" in window){var pv=new IntersectionObserver(function(es){es.forEach(function(e){var vd=e.target.querySelector("video");if(!vd)return;if(e.isIntersecting&&!reduce){vd.preload="auto";var p=vd.play();if(p&&p.catch)p.catch(function(){})}else vd.pause()})},{threshold:.1});$$(".frame",v).forEach(function(f){pv.observe(f)})}
}

/* ---------- shared rail behaviour ---------- */
function rail(el,onScroll){
  var down=false,sx=0,sl=0,moved=false;
  el.addEventListener("pointerdown",function(e){if(e.pointerType!=="mouse"||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=el.scrollLeft});
  window.addEventListener("pointermove",function(e){if(!down)return;var dx=e.clientX-sx;if(Math.abs(dx)>6){moved=true;el.classList.add("dragging")}if(moved)el.scrollLeft=sl-dx});
  window.addEventListener("pointerup",function(){if(!down)return;down=false;setTimeout(function(){el.classList.remove("dragging")},0)});
  el.addEventListener("wheel",function(e){if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;var max=el.scrollWidth-el.clientWidth;var n=el.scrollLeft+e.deltaY;if(n<=0&&el.scrollLeft<=0)return;if(n>=max&&el.scrollLeft>=max-1)return;e.preventDefault();el.scrollLeft=n},{passive:false});
  el.addEventListener("scroll",onScroll,{passive:true});
}
function head(title,line){return '<div class="page-head wrap" data-reveal><h2 class="title">'+words(title)+'</h2>'+(line?'<p class="facts-line" style="margin:0">'+esc(line)+'</p>':'')+'</div>'}

/* ---------- music ---------- */
function buildMusic(){
  var v=$("#v-music");
  var cards=C.music.map(function(m){var a=m.type==="audio",ar=a?1:ratio(m.ratio,16/9);
    return '<article class="track" data-id="'+esc(m.id)+'" style="--ar:'+ar.toFixed(4)+'"><button class="media" data-act aria-label="'+esc((a?"Play ":"Watch ")+m.composer+", "+m.title)+'"><img src="'+esc(m.cover)+'" alt="" loading="lazy" draggable="false"></button>'+
      '<div class="cap"><button class="rowplay" data-act aria-label="'+esc((a?"Play ":"Watch ")+m.composer)+'"><span class="disc">'+PLAY+'</span><span>'+(a?"Listen":"Watch")+' · '+esc(m.duration)+'</span></button><b>'+esc(m.composer)+'</b><span>'+esc(m.title)+'</span>'+(m.credit?'<small>'+esc(m.credit)+'</small>':'')+(a?(m.spotify?'<a class="spot" href="'+esc(m.spotify)+'" target="_blank" rel="noopener">Listen on Spotify <svg class="arr" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 8L8 2M3.5 2H8V6.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></a>':'<button class="spot" data-soon>Listen on Spotify <svg class="arr" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 8L8 2M3.5 2H8V6.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>'):'')+'</div></article>'}).join("");
  var rep=C.repertoire.map(function(g){if(g.heading)return '<div class="rep-heading">'+esc(g.heading)+'</div>';return '<div class="rep-group"><h4>'+esc(g.composer)+'</h4>'+(g.note?'<p>'+esc(g.note)+'</p>':'')+'<ul>'+(g.items||[]).map(function(i){return '<li>'+esc(i)+'</li>'}).join("")+'</ul></div>'}).join("");
  v.innerHTML='<div class="page">'+head("Music","Recordings and performances.")+
    '<div class="rail" id="mRail" tabindex="0" aria-label="Recordings and performances"><div class="rail-in">'+cards+'</div></div>'+
    '<div class="wrap"><div class="rail-bar"><button id="mPrev" aria-label="Back">←</button><div class="prog"><span id="mProg"></span></div><button id="mNext" aria-label="Forward">→</button></div>'+
    '<button class="drop" id="repBtn" aria-expanded="false" aria-controls="rep"><span class="t">Repertoire</span><span class="x" id="repX">Open +</span></button><div class="rep" id="rep" hidden>'+rep+'</div></div></div>'+foot();
  var r=$("#mRail");
  function upd(){var max=r.scrollWidth-r.clientWidth,w=r.clientWidth/r.scrollWidth;$("#mProg").style.width=(w*100)+"%";$("#mProg").style.left=(max>0?r.scrollLeft/max*(1-w)*100:0)+"%";$("#mPrev").disabled=r.scrollLeft<4;$("#mNext").disabled=r.scrollLeft>=max-4}
  rail(r,upd);window.addEventListener("resize",upd);setTimeout(upd,80);
  $("#mPrev").addEventListener("click",function(){r.scrollBy({left:-r.clientWidth*.7,behavior:reduce?"auto":"smooth"})});
  $("#mNext").addEventListener("click",function(){r.scrollBy({left:r.clientWidth*.7,behavior:reduce?"auto":"smooth"})});
  $$("[data-act]",v).forEach(function(b){b.addEventListener("click",function(){var id=b.closest(".track").dataset.id,m=C.music.filter(function(x){return x.id===id})[0];if(!m)return;if(m.type==="audio")playAudio(m);else openVideo(m.src,m.composer,m.title,m.cover)})});
  // until the client sends her links, the button is shown and says so politely
  $$("[data-soon]",v).forEach(function(b){b.addEventListener("click",function(){toast("Spotify link coming soon")})});
  $("#repBtn").addEventListener("click",function(){var b=$("#repBtn"),o=b.getAttribute("aria-expanded")==="true";$("#rep").hidden=o;b.setAttribute("aria-expanded",String(!o));$("#repX").textContent=o?"Open +":"Close −"});
}

/* ---------- video ---------- */
function tile(a,i,kind){var isV=/\.(mp4|webm|mov)$/i.test(a.src||""),href=!isV?(a.link||a.src||""):"";
  var inner='<span class="m" style="--ar:'+esc(a.ratio||"16/9")+'">'+(a.poster?'<img src="'+esc(a.poster)+'" alt="" loading="lazy">':'')+'</span><h3>'+esc(a.title)+'</h3><span class="mute" style="font-size:14px">'+esc([kind,a.year,a.duration].filter(Boolean).join(" · "))+'</span>'+(a.description?'<p>'+esc(a.description)+'</p>':'');
  if(isV)return '<button class="tile" data-tile="'+i+'">'+inner+'</button>';if(href)return '<a class="tile" href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'</a>';return '<div class="tile">'+inner+'</div>'}
function bindTiles(root,list){$$("[data-tile]",root).forEach(function(b){b.addEventListener("click",function(){var a=list[+b.dataset.tile];if(a)openVideo(a.src,a.title,a.kind||a.year||"",a.poster)})})}
function buildVideo(){
  var f=C.film,v=$("#v-video"),ai=C.aiFilms||[],empty=C.emptyText||{};
  // stills go in sixes: centred frame / pair / mirrored pair / wide frame
  function fig(src,c){return '<figure class="'+c+'"><div><img src="'+esc(src)+'" alt="Still from '+esc(f.title)+'" loading="lazy"></div></figure>'}

  for(var k=0;k<L.length;k+=6){var g=L.slice(k,k+6);

  var laurels=f.laurels.map(function(l){return '<li><span><span class="f">'+esc(l.festival)+'</span><span class="k">'+esc(l.label)+'</span></span><span class="mute">'+esc(l.year)+'</span></li>'}).join("");
  v.innerHTML='<div class="page" style="padding-bottom:0"><div class="wrap"><div class="tabs" role="tablist"><button role="tab" id="t-film" aria-selected="true" aria-controls="p-film">'+esc(f.tab)+'</button><button role="tab" id="t-ai" aria-selected="false" aria-controls="p-ai">AI Films</button></div></div>'+
    '<div id="p-film" role="tabpanel" aria-labelledby="t-film">'+
      '<button class="feature" id="playTrailer" aria-label="Play the trailer of '+esc(f.title)+'" data-reveal><div class="bgm"><img src="'+esc(f.trailer.poster)+'" alt=""></div><div class="label"><div><span class="title">'+words(f.title)+'</span><div class="facts-line"><span>'+esc(f.kind)+'</span><span>'+esc(f.year)+'</span></div></div><span class="play"><span class="disc">'+PLAY+'</span>Trailer · '+esc(f.trailer.duration)+'</span></div></button>'+
      '<div class="wrap"><div class="film-text"><div><p class="syn">'+esc(f.synopsis)+'</p><p class="credit">'+esc(f.credit)+'</p>'+(f.filmfreeway?'<p class="credit"><a href="'+esc(f.filmfreeway)+'" target="_blank" rel="noopener">FilmFreeway <svg class="arr" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 8L8 2M3.5 2H8V6.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></a></p>':'')+'</div><ul class="laurels">'+laurels+'</ul></div>'+
      '<div class="stills">'+stills+'</div>'+
      '<div class="film-more"><figure class="poster"><img src="'+esc(f.poster)+'" alt="Poster of '+esc(f.title)+'" loading="lazy"><figcaption>Poster</figcaption></figure><figure><button class="bts" id="playBts" aria-label="Play: '+esc(f.bts.title)+'"><img src="'+esc(f.bts.poster)+'" alt="" loading="lazy"><span class="play"><span class="disc">'+PLAY+'</span>'+esc(f.bts.duration)+'</span></button><figcaption>'+esc(f.bts.title)+'</figcaption></figure></div></div>'+
    '</div><div class="wrap" id="p-ai" role="tabpanel" aria-labelledby="t-ai" hidden><h2 class="title in" style="margin-top:48px">'+words("AI Films")+'</h2>'+(ai.length?'<div class="tiles">'+ai.map(function(a,i){return tile(a,i,"AI film")}).join("")+'</div>':'<p class="note">'+esc(empty.aiFilms||"")+'</p>')+'</div><div style="height:120px"></div></div>'+foot();
  bindTiles($("#p-ai"),ai);
  moving=moving.concat($$(".feature .bgm",v),$$(".stills figure > div",v));
  $("#playTrailer").addEventListener("click",function(){openVideo(f.trailer.src,f.title,"Trailer",f.trailer.poster)});
  $("#playBts").addEventListener("click",function(){openVideo(f.bts.src,f.title,f.bts.title,f.bts.poster)});
  var tf=$("#t-film"),ta=$("#t-ai");function sel(a){tf.setAttribute("aria-selected",String(a));ta.setAttribute("aria-selected",String(!a));$("#p-film").hidden=!a;$("#p-ai").hidden=a;move()}
  tf.addEventListener("click",function(){sel(true)});ta.addEventListener("click",function(){sel(false)});
}
function buildEducation(){
  var v=$("#v-education"),it=C.education||[],empty=C.emptyText||{};
  v.innerHTML='<div class="page">'+head("Education & Research","")+'<div class="wrap">'+(it.length?'<div class="tiles">'+it.map(function(a,i){return tile(a,i,a.kind)}).join("")+'</div>':'<p class="note">'+esc(empty.education||"")+'</p>')+'</div></div>'+foot();
  bindTiles(v,it);
}

/* ---------- biography ---------- */
function buildBio(){
  var b=C.biography,v=$("#v-biography"),p=b.paragraphs,n=b.visibleParagraphs||2;
  var facts=(b.credits||[]).map(function(c){return '<dt>'+esc(c.role)+'</dt><dd>'+esc(c.value)+'</dd>'}).join("");
  var press=C.press.map(function(x){return '<article class="p-row" id="'+esc(x.id)+'" data-reveal>'+(x.image?'<figure class="pic"><img src="'+esc(x.image)+'" alt="'+esc(x.title+" — "+x.source)+'" loading="lazy"></figure>':'<span></span>')+'<div><h3 class="n">'+esc(x.title)+'</h3><p class="s">'+esc(x.source)+'</p>'+(x.quote?'<blockquote>“'+esc(x.quote)+'”</blockquote>':'')+'</div></article>'}).join("");
  v.innerHTML='<div class="page">'+head("Biography",C.site.roles.join(" / "))+
    '<div class="wrap"><div class="bio"><figure><img src="'+esc(b.photo)+'" alt="'+esc(b.photoAlt)+'"><figcaption>Kawai Thailand International Music Competition, 2026</figcaption></figure><div><p class="lead">'+esc(p[0])+'</p>'+
    '<div class="text">'+p.slice(1).map(function(x,i){return '<p'+(i+1>=n?' data-more hidden':'')+'>'+esc(x)+'</p>'}).join("")+'</div>'+(p.length>n?'<button class="more" id="bioMore" aria-expanded="false">Read the full biography</button>':'')+(facts?'<dl class="facts">'+facts+'</dl>':'')+'</div></div>'+
    '<section class="press" aria-labelledby="pressH"><h2 class="title in" id="pressH">Press &amp; Media</h2>'+press+'</section></div></div>'+foot();
  var m=$("#bioMore");if(m)m.addEventListener("click",function(){var o=m.getAttribute("aria-expanded")==="true";$$("[data-more]",v).forEach(function(x){x.hidden=o});m.setAttribute("aria-expanded",String(!o));m.textContent=o?"Read the full biography":"Show less"});
}

/* ---------- contact ---------- */
function buildContact(){
  var c=C.contact,v=$("#v-contact");
  var reach=c.channels.map(function(x){return '<div><span class="l">'+esc(x.label)+(x.copy?'<button class="copy" data-copy="'+esc(x.value)+'">Copy</button>':'')+'</span><a href="'+esc(x.href)+'"'+(/^https?:/.test(x.href)?' target="_blank" rel="noopener"':'')+'>'+esc(x.value)+'</a></div>'}).join("");
  var where=c.facts.map(function(x){return '<span>'+esc(x.label)+' <b>'+esc(x.value)+'</b></span>'}).join("");
  v.innerHTML='<div class="page wrap">'+(c.photo?'<figure class="c-photo" data-reveal><img src="'+esc(c.photo)+'" alt="'+esc(C.site.name)+'"></figure>':'')+'<div class="cbox"><div data-reveal><h2 class="title" style="font-size:clamp(48px,9vw,160px);max-width:none">'+words(C.site.cta)+'</h2><p class="c-st facts-line">'+esc(c.statement)+'</p></div><div class="reach">'+reach+'</div></div><div class="where">'+where+'</div></div>'+foot();
  $$("[data-copy]",v).forEach(function(b){b.addEventListener("click",function(){var t=b.dataset.copy;try{navigator.clipboard.writeText(t).then(function(){toast("Address copied")},function(){sel(b)})}catch(e){sel(b)}})});
  function sel(b){var a=b.parentNode.nextElementSibling,r=document.createRange();r.selectNodeContents(a);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Press Ctrl+C to copy")}
}

/* ---------- routing ---------- */
function route(){
  var h=(location.hash||"").replace("#","");if(VIEWS.indexOf(h)<0)h="home";
  VIEWS.forEach(function(n){var el=$("#v-"+n);var was=el.hidden;el.hidden=n!==h;if(n===h&&was){el.style.animation="none";void el.offsetWidth;el.style.animation=""}});
  document.body.dataset.view=h;
  $$(".nav a").forEach(function(a){if(a.getAttribute("href")==="#"+h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(VO&&!VO.hidden)closeVideo();
  window.scrollTo(0,0);setTimeout(function(){move();tone()},20);
}
window.addEventListener("hashchange",route);
window.addEventListener("scroll",function(){document.body.classList.toggle("scrolled",scrollY>10)},{passive:true});
document.addEventListener("dblclick",function(e){if(e.target.closest&&e.target.closest("[data-studio]"))location.href="studio/"});

/* ---------- audio ---------- */
var A=$("#audio"),cur=null;
function playAudio(m){if(cur&&cur.id===m.id){if(A.paused)A.play();else A.pause();return}cur=m;A.src=m.src;A.play().catch(function(){});$("#aWho").innerHTML='<b>'+esc(m.composer)+'</b><i>'+esc(m.title)+'</i>';$("#player").hidden=false;document.body.classList.add("has-player")}
function syncA(){$("#aToggle").innerHTML=A.paused?PLAY:PAUSE;$("#aToggle").setAttribute("aria-label",A.paused?"Play":"Pause");
  $$(".track").forEach(function(c){var on=cur&&c.dataset.id===cur.id;c.classList.toggle("is-playing",!!on);var m=C&&C.music.filter(function(x){return x.id===c.dataset.id})[0];if(m&&m.type==="audio")c.querySelector(".disc").innerHTML=on&&!A.paused?PAUSE:PLAY})}
A.addEventListener("play",syncA);A.addEventListener("pause",syncA);A.addEventListener("ended",syncA);
A.addEventListener("timeupdate",function(){var d=A.duration||secs(cur&&cur.duration);$("#aTime").textContent=mmss(A.currentTime)+" / "+mmss(d);var p=d?A.currentTime/d*100:0;$("#aFill").style.width=p+"%";$("#aTrack").setAttribute("aria-valuenow",Math.round(p))});
$("#aToggle").addEventListener("click",function(){if(A.paused)A.play();else A.pause()});
$("#aClose").addEventListener("click",function(){A.pause();cur=null;$("#player").hidden=true;document.body.classList.remove("has-player");syncA()});

/* ---------- full-screen video ---------- */
var V=$("#vVideo"),last=null,idleT=0;VO=$("#vo");
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function enterFs(){var r=VO.requestFullscreen||VO.webkitRequestFullscreen;if(r){try{var p=r.call(VO);if(p&&p.catch)p.catch(function(){})}catch(e){}}else if(V.webkitEnterFullscreen){try{V.webkitEnterFullscreen()}catch(e){}}}
function openVideo(src,a,b,poster){if(!A.paused)A.pause();last=document.activeElement;V.src=src;V.poster=poster||"";V.muted=false;$("#vWho").innerHTML='<b>'+esc(a)+'</b><i>'+esc(b)+'</i>';VO.hidden=false;document.documentElement.style.overflow="hidden";enterFs();var p=V.play();if(p&&p.catch)p.catch(function(){V.muted=true;V.play().catch(function(){})});wake();$("#vClose").focus()}
function closeVideo(){V.pause();V.removeAttribute("src");V.load();VO.hidden=true;document.documentElement.style.overflow="";if(fsEl()){var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)try{var p=x.call(document);if(p&&p.catch)p.catch(function(){})}catch(e){}}if(last&&last.focus)last.focus()}
function wake(){VO.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(function(){if(!V.paused)VO.classList.add("idle")},2600)}
["mousemove","touchstart","keydown"].forEach(function(ev){VO.addEventListener(ev,wake,{passive:true})});
function syncV(){$("#vToggle").innerHTML=V.paused?PLAY:PAUSE;$("#vToggle").setAttribute("aria-label",V.paused?"Play":"Pause");$("#vSound").textContent=V.muted?"Sound off":"Sound on";$("#vFull").textContent=fsEl()?"Exit full screen":"Full screen";if(V.paused)VO.classList.remove("idle")}
V.addEventListener("play",syncV);V.addEventListener("pause",syncV);V.addEventListener("volumechange",syncV);document.addEventListener("fullscreenchange",syncV);
V.addEventListener("timeupdate",function(){var d=V.duration||0,p=d?V.currentTime/d*100:0;$("#vFill").style.width=p+"%";$("#vTime").textContent=mmss(V.currentTime)+" / "+mmss(d);$("#vTrack").setAttribute("aria-valuenow",Math.round(p))});
V.addEventListener("click",function(){if(V.paused)V.play();else V.pause()});
$("#vToggle").addEventListener("click",function(){if(V.paused)V.play();else V.pause()});
$("#vSound").addEventListener("click",function(){V.muted=!V.muted});
$("#vFull").addEventListener("click",function(){if(fsEl()){var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document)}else enterFs()});
$("#vClose").addEventListener("click",closeVideo);
document.addEventListener("keydown",function(e){if(VO.hidden)return;if(e.key==="Escape"&&!fsEl())closeVideo();if(e.key===" "){e.preventDefault();if(V.paused)V.play();else V.pause()}});
function seekable(t,m){t.addEventListener("click",function(e){var r=t.getBoundingClientRect(),x=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);if(m.duration)m.currentTime=x*m.duration});t.addEventListener("keydown",function(e){if(!m.duration)return;if(e.key==="ArrowRight")m.currentTime=Math.min(m.duration,m.currentTime+5);if(e.key==="ArrowLeft")m.currentTime=Math.max(0,m.currentTime-5)})}
seekable($("#aTrack"),A);seekable($("#vTrack"),V);syncA();syncV();

if(location.protocol==="file:")setTimeout(fallback,0);
else fetch("content.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(start).catch(fallback);
})();
</script>
